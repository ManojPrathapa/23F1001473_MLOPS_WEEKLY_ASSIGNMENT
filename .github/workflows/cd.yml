name: IRIS Continuous Deployment with Stress Testing

on:
  push:
    branches:
      - week_7
  workflow_dispatch:

env:
  PROJECT_ID: f1001473-mlops-week1
  GAR_LOCATION: us-central1
  REPOSITORY: iris-repo
  IMAGE: iris-api
  GKE_CLUSTER: iris-cluster
  GKE_ZONE: us-central1-a
  USE_GKE_GCLOUD_AUTH_PLUGIN: True

jobs:
  build-deploy-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
            ./api

      - name: Push Docker Image
        run: |
          docker push \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone=${{ env.GKE_ZONE }} --project=${{ env.PROJECT_ID }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/iris-api --timeout=180s

      - name: Install wrk Load Testing Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Run Automated Stress Test with wrk
        run: |
          EXTERNAL_IP=""
          while [ -z "$EXTERNAL_IP" ]; do
            echo "Waiting for LoadBalancer IP..."
            EXTERNAL_IP=$(kubectl get svc iris-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -z "$EXTERNAL_IP" ] && sleep 5
          done
          echo "Executing wrk stress test against API at External IP: $EXTERNAL_IP"
          wrk -t2 -c50 -d15s -s post.lua http://${EXTERNAL_IP}/predict/
